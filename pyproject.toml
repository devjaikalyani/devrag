[project]
name = "devrag"
version = "1.0.0"
description = "Chat with any codebase, then let the agent fix it. Hybrid retrieval plus an autonomous LangGraph agent, powered by Claude."
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.2",
    "transformers>=4.38",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "model2vec>=0.8",
    "rank-bm25>=0.2.2",
    "nltk>=3.9",
    "anthropic>=0.49.0",
    "beautifulsoup4>=4.12",
    "Pygments>=2.17",
    "GitPython>=3.1",
    "tiktoken>=0.6",
    "langgraph>=0.2.0",
    "langchain-core>=0.1.27",
    "PyGithub>=2.1.1",
    "razorpay>=1.4.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.9.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "httpx>=0.27",
    "requests>=2.31.0",
]

[project.scripts]
devrag = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["devrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
